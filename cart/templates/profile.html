<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
</head>
<body>
    <h1>Welcome to your profile page</h1>
    {% if user %}
        <p>Username: {{ user.username }}</p>  
        <p>Email: {{ user.email }}</p>  
    {% else %}
        <p>User not found.</p>
    {% endif %}
    
</body>
</html>
