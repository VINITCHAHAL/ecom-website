{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
    <title>Login Page</title>
  </head>
  <body>
    <div class="login-container">
      <form action="{% url 'login' %}" method="POST" class="login-form">
        {% csrf_token %}
        <h2 class="title">Login</h2>
        <div class="input-group">
          <input type="text" name="username" required placeholder="Username" />
        </div>
        <div class="input-group">
          <input type="password" name="password" required placeholder="Password" />
        </div>
        <button type="submit" class="btn">Login</button>
        <p class="signup-text">Or sign up with:</p>
        <div class="social-options">
          <a href="#" class="social-btn facebook">Facebook</a>
          <a href="#" class="social-btn google">Google</a>
          <a href="#" class="social-btn twitter">Twitter</a>
          <a href="#" class="social-btn linkedin">LinkedIn</a>
        </div>
      </form>
    </div>
  </body>
</html>
